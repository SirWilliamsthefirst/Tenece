<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="icon"
    href="resources/favicon.ico"
    type="image/x-icon"
    sizes="96x96"
  />

  <title>devChallenges.io | Minimal Blog Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <article class="card">
      <img
        class="card__image"
        src="resources/Cactus.jpg"
        srcset="resources/Cactus.jpg 1x, resources/Cactus@2x.jpg 2x"
        alt="A cactus in a pot, photographed against a plain background"
      />

      <div class="card__body">
        <h1 class="card__title">Embracing Minimalism</h1>
        <p class="card__description">
          From minimalist sculptures to minimalist paintings, this blog will
          inspire you to appreciate the beauty that lies in simplicity.
        </p>

        <p class="card__author">
          <span class="card__author-dot" aria-hidden="true"></span>
          Annie Spratt
        </p>
      </div>
    </article>
  </main>

  <div class="author-info">
    Coded by <a href="#">Your Name Here</a> | Challenge by
    <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
      >devChallenges.io</a
    >.
  </div>

</body>
</html>
