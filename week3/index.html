<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Blog Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="card">
      <img
        class="card__image"
        src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=600&h=340&fit=crop"
        alt="Laptop displaying colorful code on a wooden desk"
      >

      <div class="card__body">
        <p class="card__tag">Technology</p>
        <h2 class="card__title">Getting Started with CSS Grid</h2>
        <p class="card__description">
          A beginner-friendly walkthrough of CSS Grid fundamentals,
          covering tracks, gaps, and how to build responsive layouts
          without writing a single media query.
        </p>

        <div class="card__author">
          <img
            class="card__avatar"
            src="https://media.licdn.com/dms/image/v2/D4D03AQEGvFSKUyR2Qw/profile-displayphoto-shrink_200_200/B4DZb.JxknGkAs-/0/1748020698650?e=2147483647&v=beta&t=F1ycS3pXFgDSK8ueian0ur8f1srQR_fCgpLbp49P08o"
            alt="Portrait of the article author"
          >
          <div class="card__author-info">
            <span class="card__author-name">Odinaka Ife-Mbonu</span>
            <span class="card__author-date">21 February 2026</span>
          </div>
        </div>
      </div>
    </article>
  </main>

</body>
</html>
